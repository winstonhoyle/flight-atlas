repos:
  # Python lint and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(lambda|ecs)/.*\.py$
      - id: ruff-format
        files: ^(lambda|ecs)/.*\.py$

  # Terraform formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.78.0
    hooks:
      - id: terraform_fmt
        files: ^infra/.*\.(tf|tfvars)$

  # Ensure package-lock.json is in sync with package.json
  - repo: local
    hooks:
      - id: npm-lock-sync
        name: Check npm lockfile consistency
        entry: bash -c 'cd app && npm install --package-lock-only --ignore-scripts --no-audit --no-fund && git diff --exit-code package-lock.json || (echo "app/package-lock.json is out of sync. Run npm install in app/ and commit again." && exit 1)'
        language: system
        pass_filenames: false
        files: ^app/package(-lock)?\.json$
