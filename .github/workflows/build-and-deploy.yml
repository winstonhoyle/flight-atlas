name: Build and Deploy to AWS and Cloudfare

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: flight-atlas

permissions:
  id-token: write
  contents: read

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint, format, and test frontend
        working-directory: app
        run: npm run lint && npm run format:check && npm run test:run

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app/dist --project-name=flight-atlas --branch=main

  check-python:
    runs-on: ubuntu-latest
    name: Check Lambda and scraper (ruff, pytest)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            lambda/requirements.txt
            ecs/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r lambda/requirements.txt -r ecs/requirements.txt

      - name: Lint and test
        run: |
          ruff check lambda ecs && ruff format --check lambda ecs
          (cd lambda && python -m pytest -q)
          (cd ecs && python -m pytest -q)

  deploy-aws:
    runs-on: ubuntu-latest
    name: Deploy Backend (Lambda, ECS, Terraform)
    needs: [deploy-cloudflare, check-python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Terraform Init
        working-directory: infra
        run: terraform init -upgrade=false -input=false

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ECS + Lambda images
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          REPO=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build --provenance=false --platform linux/amd64 -t $REPO:ecs-$IMAGE_TAG ecs/
          docker build --provenance=false --platform linux/amd64 -t $REPO:lambda-$IMAGE_TAG lambda/
          docker push $REPO:ecs-$IMAGE_TAG
          docker push $REPO:lambda-$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_cloudflare_zone_io_id: ${{ secrets.CLOUDFLARE_ZONE_IO_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform plan -var "image_tag=$image_tag" -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra
        env:
          TF_VAR_cloudflare_zone_io_id: ${{ secrets.CLOUDFLARE_ZONE_IO_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -auto-approve tfplan
